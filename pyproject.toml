[project]
name = "freelance-currency-cli"
version = "1.0.0"
description = "Convert an invoice amount between currencies (USD/EUR/RUB/160+) using a free no-key API, with a manual --rate override for offline use. Zero third-party dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "currency-converter", "exchange-rate", "invoice", "rub", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/freelance-currency-cli"
Repository = "https://github.com/kleogeos/freelance-currency-cli"

[project.scripts]
freelance-currency = "currency:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["currency"]
